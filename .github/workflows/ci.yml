name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Offline checks (no API key needed)
        run: |
          node --check lib/index.js
          node --check lib/core.js
          node --check bin/deepseek-tools.mjs
          node test/host-shape.test.mjs
          node test/smoke.mjs
